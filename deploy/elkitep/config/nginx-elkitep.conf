server {
    listen 80;
    server_name elkitep.gps.gov.kg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name elkitep.gps.gov.kg;

    ssl_certificate     /etc/ssl/elkitep/elkitep.gps.gov.kg.crt;
    ssl_certificate_key /etc/ssl/elkitep/elkitep.gps.gov.kg.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 15M;

    # Сайт (React)
    root /srv/kutbilim/web;
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # APK для скачивания
    location /downloads/ {
        alias /srv/kutbilim/downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }

    # Статика админки Django
    location /static/ {
        alias /srv/kutbilim/backend/staticfiles/;
    }

    # API и админка -> Django (media наружу НЕ открываем: фото отдаются через API)
    location ~ ^/(api|panel-14b4e2ca22977f71a87338b5b57bdcbe)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
